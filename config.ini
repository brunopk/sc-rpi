[MAIN]
env = dev
default_gateway = 192.168.0.1
default_network_interface = en0
status_led = 17
connection_timeout = 0.25
log_level = DEBUG

[MQTT.BROKER]
host=homeassistant.local
port=1883
username=test
password=test

[MQTT.TOPICS]
ha_topic_prefix=homeassistant
sc_rpi_topic_prefix=scrpi

[PIXEL_STRIP]
brightness = 255
channel = 0
dma = 10
freq_hz = 800000
invert = False
pin = 18
strip_length = 300
