[tool.poetry]
name = "sc-rpi"
version = "0.1.0"
description = "A project to control W2812B led strips with Raspberry Pi"
authors = ["Bruno Piaggio <brunopiaggiok@gmail.com>"]
readme = "README.md"
packages=[{from= "src", include = "sc_rpi"}]

[tool.poetry.dependencies]
python = "^3.9"
inflector = "3.1.1"
toml = "^0.10.2"
paho-mqtt = "^2.1.0"
mashumaro = "^3.16"
pyaml = "^25.7.0"
python-logging-loki = "^0.3.1"

[tool.poetry.group.dev.dependencies]
"RPi.GPIO" = {path = "lib/RPI.GPIO", develop = true}
systemd-python = {path = "lib/systemd-python", develop = true}
rpi-ws281x = {path = "lib/rpi-ws281x", develop = true}
ruff = "^0.11.13"

[tool.poetry.group.rpi-only-deps.dependencies]
#systemd-python = "235"
#"RPi.GPIO" = "0.7.1"
#rpi-ws281x = "5.0.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py38"
select = ["ALL"]
line-length = 88
