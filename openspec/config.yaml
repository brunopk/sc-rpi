schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  proposal: &style
    - Write in impersonal prose; do not use "we" or "you".
  specs: *style
  design: *style
  tasks:
    - Write in impersonal prose; do not use "we" or "you".
    - Write each task as one checkbox line that says what to build, then a nested
      "Verify with:" list with one bullet per check (a test case, a command and its
      expected result, or a delivered artifact).
    - Keep verification out of the checkbox line; put every check in the nested list,
      one check per bullet.
    - Start each bullet with a capital letter (or with a backticked identifier), wrap
      commands and identifiers in backticks and keep each bullet to one line.
